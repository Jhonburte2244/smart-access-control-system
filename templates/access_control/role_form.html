{% extends "dashboard/base.html" %}

{% block title %}
    {% if edit_mode %}
        Edit Role
    {% else %}
        Add Role
    {% endif %}
{% endblock %}

{% block content %}

<div class="container-fluid py-4">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="card shadow-sm border-0">

                <div class="card-header bg-white py-3">

                    <h4 class="fw-bold mb-0">

                        <i class="bi bi-person-badge me-2"></i>

                        {% if edit_mode %}
                            Edit Role
                        {% else %}
                            Add Role
                        {% endif %}

                    </h4>

                </div>


                <div class="card-body p-4">

                    <form method="POST">

                        {% csrf_token %}


                        <!-- ROLE NAME -->

                        <div class="mb-3">

                            <label
                                for="name"
                                class="form-label fw-semibold"
                            >
                                Role Name
                                <span class="text-danger">*</span>
                            </label>

                            <input
                                type="text"
                                id="name"
                                name="name"
                                class="form-control"
                                maxlength="100"
                                value="{% if role %}{{ role.name }}{% endif %}"
                                required
                            >

                        </div>


                        <!-- DESCRIPTION -->

                        <div class="mb-3">

                            <label
                                for="description"
                                class="form-label fw-semibold"
                            >
                                Description
                            </label>

                            <textarea
                                id="description"
                                name="description"
                                class="form-control"
                                rows="4"
                            >{% if role %}{{ role.description }}{% endif %}</textarea>

                        </div>


                        <!-- STATUS -->

                        <div class="form-check form-switch mb-4">

                            <input
                                class="form-check-input"
                                type="checkbox"
                                role="switch"
                                id="is_active"
                                name="is_active"
                                {% if not role or role.is_active %}
                                    checked
                                {% endif %}
                            >

                            <label
                                class="form-check-label fw-semibold"
                                for="is_active"
                            >
                                Active
                            </label>

                        </div>


                        <!-- BUTTONS -->

                        <div class="d-flex gap-2">

                            <a
                                href="{% if edit_mode %}{% url 'access_control:role_detail' role.id %}{% else %}{% url 'access_control:roles' %}{% endif %}"
                                class="btn btn-secondary"
                            >
                                <i class="bi bi-x-circle me-1"></i>
                                Cancel
                            </a>

                            <button
                                type="submit"
                                class="btn btn-primary"
                            >

                                {% if edit_mode %}

                                    <i class="bi bi-save me-1"></i>
                                    Update Role

                                {% else %}

                                    <i class="bi bi-plus-circle me-1"></i>
                                    Add Role

                                {% endif %}

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
