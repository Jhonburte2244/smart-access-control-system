{% extends "dashboard/base.html" %}

{% block title %}
    General Settings | Smart Access Control System
{% endblock %}

{% block content %}

<div class="container-fluid">

    <div class="mb-4">
        <h2 class="fw-bold mb-1">
            General Settings
        </h2>

        <p class="text-muted mb-0">
            Configure general Smart Access Control System settings.
        </p>
    </div>


    <form method="post">

        {% csrf_token %}

        <div class="card shadow-sm border-0">

            <div class="card-body p-4">

                <h5 class="fw-bold mb-4">
                    <i class="bi bi-info-circle me-2"></i>
                    System Information
                </h5>


                <div class="row g-4">

                    <!-- System Name -->

                    <div class="col-md-6">

                        <label class="form-label fw-semibold">
                            System Name
                        </label>

                        <input type="text"
                               name="system_name"
                               class="form-control"
                               value="{{ settings.system_name }}"
                               required>

                    </div>


                    <!-- System Code -->

                    <div class="col-md-6">

                        <label class="form-label fw-semibold">
                            System Code
                        </label>

                        <input type="text"
                               name="system_code"
                               class="form-control"
                               value="{{ settings.system_code }}"
                               required>

                    </div>


                    <!-- Organization -->

                    <div class="col-md-6">

                        <label class="form-label fw-semibold">
                            Organization
                        </label>

                        <input type="text"
                               name="organization"
                               class="form-control"
                               value="{{ settings.organization }}">

                    </div>


                    <!-- Location -->

                    <div class="col-md-6">

                        <label class="form-label fw-semibold">
                            Location
                        </label>

                        <input type="text"
                               name="location"
                               class="form-control"
                               value="{{ settings.location }}">

                    </div>


                    <!-- Time Zone -->

                    <div class="col-md-6">

                        <label class="form-label fw-semibold">
                            Time Zone
                        </label>

                        <select name="timezone"
                                class="form-select">

                            <option value="Africa/Addis_Ababa"
                                {% if settings.timezone == "Africa/Addis_Ababa" %}
                                    selected
                                {% endif %}>
                                Africa/Addis_Ababa
                            </option>

                            <option value="UTC"
                                {% if settings.timezone == "UTC" %}
                                    selected
                                {% endif %}>
                                UTC
                            </option>

                        </select>

                    </div>


                    <!-- Date Format -->

                    <div class="col-md-3">

                        <label class="form-label fw-semibold">
                            Date Format
                        </label>

                        <select name="date_format"
                                class="form-select">

                            <option value="d/m/Y"
                                {% if settings.date_format == "d/m/Y" %}
                                    selected
                                {% endif %}>
                                DD/MM/YYYY
                            </option>

                            <option value="m/d/Y"
                                {% if settings.date_format == "m/d/Y" %}
                                    selected
                                {% endif %}>
                                MM/DD/YYYY
                            </option>

                            <option value="Y-m-d"
                                {% if settings.date_format == "Y-m-d" %}
                                    selected
                                {% endif %}>
                                YYYY-MM-DD
                            </option>

                        </select>

                    </div>


                    <!-- Time Format -->

                    <div class="col-md-3">

                        <label class="form-label fw-semibold">
                            Time Format
                        </label>

                        <select name="time_format"
                                class="form-select">

                            <option value="24"
                                {% if settings.time_format == "24" %}
                                    selected
                                {% endif %}>
                                24 Hour
                            </option>

                            <option value="12"
                                {% if settings.time_format == "12" %}
                                    selected
                                {% endif %}>
                                12 Hour
                            </option>

                        </select>

                    </div>

                </div>


                <hr class="my-4">


                <div class="d-flex justify-content-end">

                    <button type="submit"
                            class="btn btn-primary">

                        <i class="bi bi-check-lg me-1"></i>

                        Save Settings

                    </button>

                </div>

            </div>

        </div>

    </form>

</div>

{% endblock %}
