{% extends "dashboard/base.html" %}

{% block content %}

<div class="container-fluid">

    <div class="mb-4">

        <h2 class="fw-bold mb-1">
            Edit Employee
        </h2>

        <p class="text-muted">
            Update employee information
        </p>

    </div>


    <div class="card shadow-sm border-0">

        <div class="card-body">

            <form method="post">

                {% csrf_token %}

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            First Name
                        </label>

                        <input type="text"
                               name="first_name"
                               class="form-control"
                               value="{{ employee.first_name }}"
                               required>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Last Name
                        </label>

                        <input type="text"
                               name="last_name"
                               class="form-control"
                               value="{{ employee.last_name }}"
                               required>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input type="email"
                               name="email"
                               class="form-control"
                               value="{{ employee.email }}">

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Phone
                        </label>

                        <input type="text"
                               name="phone"
                               class="form-control"
                               value="{{ employee.phone }}">

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Status
                        </label>

                        <select name="status"
                                class="form-select">

                            <option value="active"
                                {% if employee.status == "active" %}selected{% endif %}>
                                Active
                            </option>

                            <option value="inactive"
                                {% if employee.status == "inactive" %}selected{% endif %}>
                                Inactive
                            </option>

                        </select>

                    </div>

                </div>


                <div class="mt-3">

                    <button type="submit"
                            class="btn btn-primary">
                        Save Changes
                    </button>

                    <a href="{% url 'employee_detail' employee.id %}"
                       class="btn btn-outline-secondary">
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
